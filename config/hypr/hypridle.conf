listener {
    timeout = 1500
    on-timeout = cat /sys/class/backlight/intel_backlight/brightness > /tmp/intel_backlight; exec swayosd-client --brightness=-50
    on-resume = exec cat /tmp/intel_backlight > /sys/class/backlight/intel_backlight/brightness
}

listener {
    timeout = 1800
    on-timeout = exec hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = exec hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

listener {
    timeout = 3600
    on-timeout = exec systemctl suspend
}
