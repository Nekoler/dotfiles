active_border_color #FFFFFF
background #282828
background_opacity 0.9
clear_all_mouse_actions yes
clear_all_shortcuts yes
cursor #FFFFFF
cursor_blink_interval 0.6
cursor_text_color #282828
cursor_trail 1
cursor_trail_decay 0.1 0.3
draw_minimal_borders no
# focus_follows_mouse yes
font_family monospace
font_size 12
foreground #CCCCCC
hide_window_decorations titlebar-only
inactive_border_color #282828
initial_window_height 720
initial_window_width 1280
mouse_hide_wait -1
paste_actions confirm-if-large
remember_window_size no
scrollback_lines 1000
scrollback_pager_history_size 1
scrollbar scrolled-and-hovered
scrollbar_gap 0
scrollbar_handle_opacity 1
scrollbar_hitbox_expansion 2
scrollbar_hover_width 1
scrollbar_jump_on_click no
scrollbar_radius 0
scrollbar_track_color #000000
scrollbar_handle_opacity 1
scrollbar_track_hover_opacity 1
scrollbar_track_opacity 0.01
scrollbar_track_color #000000
scrollbar_width 1
selection_background #FFFFFF
selection_foreground #282828
# show_hyperlink_targets always
strip_trailing_spaces always
# symbol_map U+4E00-U+9FFF 微软雅黑
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
# underline_hyperlinks always
url_color #00AAAA
url_style straight
wheel_scroll_multiplier 4
window_border_width 1px
window_resize_step_cells 1
window_resize_step_lines 1

map ctrl+0 change_font_size all 0
map ctrl+alt+down resize_window narrower
map ctrl+alt+n new_tab
map ctrl+alt+p command_palette
map ctrl+alt+r load_config_file
map ctrl+alt+up resize_window wider
# map ctrl+b launch bash -l
map ctrl+c combine : copy_to_clipboard : clear_selection
map ctrl+delete clear_terminal reset active
map ctrl+down resize_window shorter
map ctrl+equal change_font_size all +1.0
map ctrl+f search_scrollback
map ctrl+f11 toggle_maximized
map ctrl+minus change_font_size all -1.0
map ctrl+n new_window
map ctrl+page_down scroll_page_down
map ctrl+page_up scroll_page_up
map ctrl+shift+c send_text normal \x03
map ctrl+up resize_window taller
map ctrl+v paste_from_clipboard
map ctrl+w close_window_with_confirmation ignore-shell
map f11 toggle_fullscreen

mouse_map ctrl+left press grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+right press grabbed,ungrabbed combine : copy_to_clipboard : clear_selection
mouse_map left doublepress grabbed,ungrabbed mouse_selection word
mouse_map left press grabbed,ungrabbed mouse_selection normal
mouse_map left triplepress grabbed,ungrabbed mouse_selection line
mouse_map right press grabbed,ungrabbed paste_from_clipboard
mouse_map shift+left press grabbed,ungrabbed mouse_selection extend
