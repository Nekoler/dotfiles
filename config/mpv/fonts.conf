<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <description>Default fonts for mpv</description>

    <dir prefix="xdg">fontsall</dir>
    <cachedir prefix="xdg">mpv</cachedir>

    <match>
        <test name="family">
            <string>mono</string>
        </test>
        <edit name="family">
            <string>monospace</string>
        </edit>
    </match>

    <match>
        <test name="family">
            <string>sans serif</string>
        </test>
        <edit name="family">
            <string>sans-serif</string>
        </edit>
    </match>

    <match>
        <test name="family">
            <string>sans</string>
        </test>
        <edit name="family">
            <string>sans-serif</string>
        </edit>
    </match>

    <include ignore_missing="yes" prefix="xdg">fontconfig/conf.d</include>

    <match>
        <test name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family">
            <string>Arial</string>
            <string>方正兰亭准黑_GBK</string>
            <string>Symbols Nerd Font</string>
        </edit>
    </match>

    <match>
        <test name="family">
            <string>serif</string>
        </test>
        <edit name="family">
            <string>Times New Roman</string>
            <string>Source Han Serif SC</string>
        </edit>
    </match>

    <match>
        <test name="family">
            <string>monospace</string>
        </test>
        <edit name="family">
            <string>Consolas</string>
            <string>方正兰亭准黑_GBK</string>
            <string>Symbols Nerd Font Mono</string>
        </edit>
    </match>

    <config>
        <rescan>
            <int>600</int>
        </rescan>
    </config>
</fontconfig>
